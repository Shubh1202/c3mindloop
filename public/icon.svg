<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="cube-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>

  <!-- 3D Cube Outer Frame -->
  <!-- Top Face -->
  <path d="M 50 8 L 88 28 L 50 48 L 12 28 Z" stroke="#0091FF" stroke-width="4" stroke-linejoin="round" fill="rgba(0, 145, 255, 0.08)"/>
  <!-- Left Face -->
  <path d="M 12 28 L 50 48 L 50 90 L 12 70 Z" stroke="#0091FF" stroke-width="4" stroke-linejoin="round" fill="rgba(0, 145, 255, 0.04)"/>
  <!-- Right Face -->
  <path d="M 50 48 L 88 28 L 88 70 L 50 90 Z" stroke="#0091FF" stroke-width="4" stroke-linejoin="round" fill="rgba(0, 145, 255, 0.12)"/>

  <!-- Top Face Symbol: </> -->
  <path d="M 38 26 L 43 21 M 57 26 L 62 21 M 52 18 L 48 30" stroke="#00A3FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Face Symbol: Brain & Bug -->
  <!-- Brain outline -->
  <path d="M 24 46 C 21 44, 21 40, 25 39 C 25 36, 31 35, 33 38 C 36 36, 40 38, 38 42 C 41 44, 38 48, 35 48 C 33 51, 27 51, 25 48 Z" stroke="#00A3FF" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  <!-- Bug underneath -->
  <circle cx="31" cy="56" r="3" stroke="#00A3FF" stroke-width="1.5" fill="none"/>
  <path d="M 28 56 L 25 54 M 34 56 L 37 54 M 28 58 L 25 61 M 34 58 L 37 61 M 31 53 L 31 51" stroke="#00A3FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right Face Symbol: 3 -->
  <text x="69" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0091FF" text-anchor="middle">3</text>
</svg>
